name: Teach Me CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript syntax
        run: |
          node --check server.mjs
          node --check public/app.js
          node --check public/demo-fallback.js
          node --check public/json-safe.js
          node --check test.mjs

      - name: Run smoke tests
        env:
          USE_SUPABASE: "false"
          SESSION_SECRET: ci-test-secret
        run: npm test
