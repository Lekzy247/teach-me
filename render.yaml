services:
  - type: web
    name: teach-me
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: npm run start:demo
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: USE_SUPABASE
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
